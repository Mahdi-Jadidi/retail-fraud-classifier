[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-fraud-classifier"
version = "1.0.0"
description = "Leakage-aware, time-split retail fraud classification pipeline"
requires-python = ">=3.10"
dependencies = ["joblib>=1.3", "numpy>=1.24", "pandas>=2.0", "openpyxl>=3.1", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
retail-fraud = "retail_fraud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
